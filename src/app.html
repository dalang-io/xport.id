<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo-xport.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<!-- Primary Meta Tags -->
		<title>XPORT Indonesia</title>
		<meta name="title" content="XPORT Indonesia" />
		<meta name="description" content="XPORT Indonesia adalah perusahaan ekspor-impor yang mendukung pelaku usaha menjangkau pasar global dengan layanan logistik dan perizinan." />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://xport.id/" />
		<meta property="og:title" content="XPORT Indonesia" />
		<meta property="og:description" content="XPORT Indonesia adalah perusahaan ekspor-impor yang mendukung pelaku usaha menjangkau pasar global dengan layanan logistik dan perizinan." />

		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://xport.id/" />
		<meta property="twitter:title" content="XPORT Indonesia" />
		<meta property="twitter:description" content="XPORT Indonesia adalah perusahaan ekspor-impor yang mendukung pelaku usaha menjangkau pasar global dengan layanan logistik dan perizinan." />
		<meta property="twitter:image" content="https://xport.id/logo-xport.png" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
